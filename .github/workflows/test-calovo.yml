name: Analyze Calovo Feeds

on:
  workflow_dispatch:

jobs:
  analyze-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Download Füchse Berlin
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_FUECHSE_URL }}" \
            -o fuechse.ics

      - name: Download SC Magdeburg
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_SCM_URL }}" \
            -o scm.ics

      - name: Download THW Kiel
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_THW_URL }}" \
            -o thw.ics

      - name: Download SG Flensburg-Handewitt
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_SG_URL }}" \
            -o sg.ics

      - name: Analyze Füchse Berlin
        run: |
          echo "===== FÜCHSE BERLIN ====="
          grep -E '^(SUMMARY|DESCRIPTION|CATEGORIES|LOCATION|DTSTART|DTEND|UID)' fuechse.ics || true

      - name: Analyze SC Magdeburg
        run: |
          echo "===== SC MAGDEBURG ====="
          grep -E '^(SUMMARY|DESCRIPTION|CATEGORIES|LOCATION|DTSTART|DTEND|UID)' scm.ics || true

      - name: Analyze THW Kiel
        run: |
          echo "===== THW KIEL ====="
          grep -E '^(SUMMARY|DESCRIPTION|CATEGORIES|LOCATION|DTSTART|DTEND|UID)' thw.ics || true

      - name: Analyze SG Flensburg-Handewitt
        run: |
          echo "===== SG FLENSBURG-HANDEWITT ====="
          grep -E '^(SUMMARY|DESCRIPTION|CATEGORIES|LOCATION|DTSTART|DTEND|UID)' sg.ics || true
