name: Diagnose Calovo Feeds

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Feeds herunterladen
        run: |
          curl -fL --silent --show-error "${{ secrets.CALOVO_FUECHSE_URL }}" -o fuechse.ics
          curl -fL --silent --show-error "${{ secrets.CALOVO_SCM_URL }}" -o scm.ics
          curl -fL --silent --show-error "${{ secrets.CALOVO_THW_URL }}" -o thw.ics
          curl -fL --silent --show-error "${{ secrets.CALOVO_SG_URL }}" -o sg.ics

      - name: Diagnose
        run: |
          for file in fuechse.ics scm.ics thw.ics sg.ics; do
            echo ""
            echo "========================================"
            echo " $file"
            echo "========================================"

            echo ""
            echo "--- Termine nach Jahr ---"
            grep '^DTSTART' "$file" \
              | sed -E 's/.*:([0-9]{4}).*/\1/' \
              | sort | uniq -c

            echo ""
            echo "--- Anzahl Spiele ---"
            echo "VEVENTs: $(grep -c 'BEGIN:VEVENT' "$file")"

            echo ""
            echo "--- Letzte 5 Termine im Feed ---"

            awk '
              BEGIN {
                RS="END:VEVENT";
                FS="\n";
                count=0
              }

              /BEGIN:VEVENT/ {
                date="";
                summary="";
                location="";

                for (i=1; i<=NF; i++) {
                  if ($i ~ /^DTSTART/) date=$i;
                  if ($i ~ /^SUMMARY:/) summary=$i;
                  if ($i ~ /^LOCATION:/) location=$i;
                }

                if (date != "") {
                  data[++count]=date " | " summary " | " location;
                }
              }

              END {
                start=count-4;
                if (start < 1) start=1;

                for (i=start; i<=count; i++) {
                  print data[i];
                }
              }
            ' "$file"

            echo ""
          done
