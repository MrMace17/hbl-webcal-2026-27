name: Analyze Calovo Feeds

on:
  workflow_dispatch:

jobs:
  analyze-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Download Füchse Berlin
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_FUECHSE_URL }}" -o fuechse.ics

      - name: Download SC Magdeburg
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_SCM_URL }}" -o scm.ics

      - name: Download THW Kiel
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_THW_URL }}" -o thw.ics

      - name: Download SG Flensburg-Handewitt
        run: |
          curl -fL --silent --show-error \
            "${{ secrets.CALOVO_SG_URL }}" -o sg.ics

      - name: Compact analysis
        run: |
          for file in fuechse.ics scm.ics thw.ics sg.ics; do
            echo ""
            echo "========================================"
            echo "DATEI: $file"
            echo "========================================"

            echo ""
            echo "--- Wettbewerbs-/Kategorieangaben ---"
            grep -E '^(CATEGORIES|X-[A-Z0-9-]*CATEGORY|X-[A-Z0-9-]*COMPETITION)' "$file" \
              | sort -u || true

            echo ""
            echo "--- Erste 10 Spiele ---"
            awk '
              BEGIN { RS="END:VEVENT"; FS="\n" }
              /BEGIN:VEVENT/ {
                summary=""; date=""; location=""; categories="";
                for (i=1; i<=NF; i++) {
                  if ($i ~ /^SUMMARY:/) summary=$i;
                  if ($i ~ /^DTSTART/) date=$i;
                  if ($i ~ /^LOCATION:/) location=$i;
                  if ($i ~ /^CATEGORIES:/) categories=$i;
                }
                print date;
                print summary;
                if (categories != "") print categories;
                if (location != "") print location;
                print "---";
                count++;
                if (count >= 10) exit;
              }
            ' "$file"

            echo ""
            echo "--- Anzahl Spiele ---"
            grep -c "BEGIN:VEVENT" "$file"
          done
